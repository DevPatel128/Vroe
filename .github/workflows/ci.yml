name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Secrets are deliberately NOT referenced in this workflow, so it is safe to run
# on pull requests from forks. Deployment lives in deploy.yml, which runs only
# on pushes to main.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be moved to point
      # at different code; a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts is the important flag. Install scripts are the main way
      # a compromised package executes code on a build machine, and nothing here
      # needs one at install time.
      - name: Install
        run: npm ci --ignore-scripts

      # sharp ships prebuilt binaries that its install script would normally
      # place; --ignore-scripts skips that, so fetch them explicitly.
      - name: Prepare native deps
        run: npm rebuild sharp

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Generate SBOM
        run: npm run audit:sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      # A last look at what would actually be published. The test suite covers
      # this too; this is the belt to its braces, and it fails loudly in the log.
      - name: Check the build output for leaks
        run: |
          set -euo pipefail
          echo "Scanning dist/client for secrets and stray files…"
          if find dist/client -name '*.map' | grep -q .; then
            echo "::error::source maps found in dist/client"; exit 1
          fi
          # Any dotfile other than .well-known is unexpected. This catches the
          # named cases (.env, .git, .dev.vars) and also build metadata such as
          # Vite's .vite/manifest.json, which maps every source path to its
          # hashed output name and must not be published.
          stray=$(find dist/client -name '.*' -not -name '.well-known' \
                    -not -path '*/.well-known/*' -mindepth 1 || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected dotfiles in dist/client:"; echo "$stray"; exit 1
          fi
          if grep -rIl --exclude='*.jpg' --exclude='*.avif' --exclude='*.webp' \
               -e 'TURNSTILE_SECRET' -e 'CLOUDFLARE_API_TOKEN' dist/client 2>/dev/null | grep -q .; then
            echo "::error::a secret name appears in the build output"; exit 1
          fi
          echo "Build output is clean."

      # GitHub's own secret scanning and push protection are not available on a
      # private repo without Advanced Security, so this stands in for them. It
      # deliberately adds no third-party action: everything here is grep against
      # files git is actually tracking.
      - name: Check the repository for committed secrets
        run: |
          set -euo pipefail
          echo "Scanning tracked files for credentials…"
          fail=0

          # 1. Environment files must never be committed at all.
          if git ls-files | grep -Ex '\.env(\..*)?|\.dev\.vars|.*/\.env(\..*)?|.*/\.dev\.vars' | grep -v '^\.env\.example$' | grep -q .; then
            echo "::error::an environment file is tracked by git"
            git ls-files | grep -Ex '\.env(\..*)?|\.dev\.vars' | grep -v '^\.env\.example$'
            fail=1
          fi

          # 2. High-signal credential shapes, in tracked text files only.
          #    .env.example is excluded: it documents NAMES and holds no values.
          files=$(git ls-files | grep -vE '\.(jpg|jpeg|png|webp|avif|woff2|ico|pdf)$' | grep -v '^\.env\.example$')
          patterns='
          [A-Za-z0-9_-]*(SECRET|TOKEN|PASSWORD|PRIVATE_KEY)[A-Za-z0-9_-]*[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_\-]{16,}
          -----BEGIN[[:space:]][A-Z ]*PRIVATE KEY-----
          0x4[A-Za-z0-9_-]{30,}
          '
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            # A line may opt out with a trailing "allowlist secret" comment.
            # Test fixtures use it; a real key pasted into a test still fails.
            hits=$(printf '%s\n' $files | xargs -r grep -InE "$pat" 2>/dev/null \
                     | grep -v 'allowlist secret' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible credential committed:"; echo "$hits" | head -20; fail=1
            fi
          done <<< "$patterns"

          [ "$fail" -eq 0 ] || exit 1
          echo "No credentials found in tracked files."
