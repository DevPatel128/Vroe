name: perf-exp
on:
  pull_request:
    paths: [".github/workflows/perf-exp.yml"]
permissions:
  contents: read
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { name: base, flags: "" }
          - { name: nospare, flags: "--disable-features=SpareRendererForSitePerProcess" }
          - { name: pertab, flags: "--process-per-tab" }
          - { name: nositeiso, flags: "--disable-site-isolation-trials --disable-features=IsolateOrigins,site-per-process" }
          - { name: nogpu, flags: "--disable-gpu --disable-dev-shm-usage" }
          - { name: norendererbg, flags: "--disable-renderer-backgrounding --disable-background-timer-throttling --disable-backgrounding-occluded-windows" }
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            code/package-lock.json
            code/perf/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm rebuild sharp
      - run: npm run build
      - working-directory: code/perf
        run: npm ci --ignore-scripts
      - name: versions
        run: google-chrome --version; node --version
      - name: start
        env: { CI: "true", WRANGLER_SEND_METRICS: "false" }
        run: nohup npm run preview -- --port 8788 > preview.log 2>&1 &
      - name: loop
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8788/api/health >/dev/null && break; sleep 1; done
          ok=0; bad=0; other=0
          for i in $(seq 1 40); do
            for p in /trove /products; do
              out=$(node perf/node_modules/lighthouse/cli/index.js "http://localhost:8788$p" --quiet --output=json --output-path=/tmp/o.json --only-categories=performance "--chrome-flags=--headless=new --no-sandbox ${{ matrix.cfg.flags }}" 2>&1) && ok=$((ok+1)) || { if echo "$out" | grep -q NO_NAVSTART; then bad=$((bad+1)); else other=$((other+1)); echo "$out" | head -3; fi; }
            done
          done
          echo "RESULT ${{ matrix.cfg.name }} ok=$ok navstart=$bad other=$other"
