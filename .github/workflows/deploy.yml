name: Deploy

on:
  push:
    branches: [main]
  # Manual redeploy without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two commits concurrently; let the newer one win.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare native deps
        run: npm rebuild sharp

      - name: Build
        run: npm run build

      # Deploying a build that fails its own tests is never the right call.
      - name: Test
        run: npm test

      - name: Deploy to Cloudflare
        # The token is scoped to Workers Scripts:Edit, Workers KV Storage:Edit,
        # Account Settings:Read and Zone:Workers Routes:Edit on vroelabs.com.
        # It is not a global API key. See docs/06-deployment.md.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test the live site
        run: |
          set -euo pipefail

          # Print exactly what this runner received, before failing on it.
          #
          # The same request can be answered differently for different clients:
          # a header present from one location can be absent from another, and a
          # bot-management challenge is served from Cloudflare rather than from
          # the Worker, carrying its own headers. Neither is diagnosable from a
          # bare "missing X", so every failure path dumps the real response.
          dump() {
            echo "--- status line and headers as this runner sees them ---"
            curl -sS -o /dev/null -D /tmp/h.txt -w 'http_code=%{http_code} http_version=%{http_version}\n' \
              https://vroelabs.com || true
            cat /tmp/h.txt || true
            echo "--- content-security-policy headers returned (more than one is the tell) ---"
            grep -ic '^content-security-policy:' /tmp/h.txt || true
            grep -i '^content-security-policy:' /tmp/h.txt || true
            echo "--- bot-management / mitigation headers ---"
            grep -iE '^(cf-mitigated|cf-chl|server|cf-ray|cf-cache-status):' /tmp/h.txt || echo "(none)"
            echo "--- first 400 bytes of body ---"
            curl -sS https://vroelabs.com | head -c 400 || true
            echo
            echo "--- end ---"
          }

          # A challenge is not a site failure, and must not be reported as one.
          #
          # Bot Fight Mode challenges datacentre IPs, which is exactly what a
          # GitHub runner is. Cloudflare then answers 403 with its own "Just a
          # moment..." page instead of invoking the Worker, and that page carries
          # Cloudflare's CSP - which permits inline style. The old check saw that
          # and reported "unsafe-inline in CSP", blaming the site for a header it
          # never sent. Detect the challenge by name instead.
          challenged() {
            curl -sS -o /dev/null -D /tmp/c.txt https://vroelabs.com || true
            grep -qi '^cf-mitigated:' /tmp/c.txt
          }

          if challenged; then
            echo "::error::Cloudflare is challenging this runner, so the deploy cannot be verified."
            echo "The site itself is not necessarily broken - Cloudflare answered before the Worker ran."
            dump
            echo "Fix by either:"
            echo "  - turning Bot Fight Mode off (SSL/TLS is not affected; the subscribe"
            echo "    endpoint still has Turnstile, a honeypot and a per-IP rate limit), or"
            echo "  - adding a WAF skip rule that matches a header this job sends."
            exit 1
          fi

          # Wait for the new version to actually be live, rather than sleeping a
          # fixed ten seconds and hoping. A Worker deploy propagates across
          # Cloudflare's network over rather longer than that, and during the
          # rollout an edge node can answer without the new version's headers —
          # which failed this step once with `strict-transport-security` missing
          # while the site itself was completely healthy. Poll instead.
          echo "Waiting for the new version to roll out…"
          required="content-security-policy strict-transport-security \
                    x-content-type-options x-frame-options referrer-policy"
          deadline=$((SECONDS + 180))
          while :; do
            headers=$(curl -sI https://vroelabs.com || true)
            missing=""
            for h in $required; do
              echo "$headers" | grep -qi "^$h:" || missing="$missing $h"
            done
            [ -z "$missing" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::after 180s these headers are still missing:$missing"
              dump; exit 1
            fi
            echo "  not yet — missing:$missing"
            sleep 5
          done
          echo "All security headers present."

          if echo "$headers" | grep -qi "unsafe-inline"; then
            echo "::error::unsafe-inline appeared in a response header"
            dump; exit 1
          fi

          echo "Checking routes…"
          for path in / /trove /vero /notes/trove /notes/vero /about /contact \
                      /privacy /terms /robots.txt /sitemap.xml /.well-known/security.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://vroelabs.com$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

          echo "Checking health…"
          curl -s https://vroelabs.com/api/health | grep -q '"ready":true' \
            || { echo "::error::/api/health not ready"; exit 1; }

          echo "Live site verified."
