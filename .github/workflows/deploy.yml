name: Deploy

on:
  push:
    branches: [main]
  # Manual redeploy without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two commits concurrently; let the newer one win.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare native deps
        run: npm rebuild sharp

      - name: Build
        run: npm run build

      # Deploying a build that fails its own tests is never the right call.
      - name: Test
        run: npm test

      - name: Deploy to Cloudflare
        # The token is scoped to Workers Scripts:Edit, Workers KV Storage:Edit,
        # Account Settings:Read and Zone:Workers Routes:Edit on vroelabs.com.
        # It is not a global API key. See docs/06-deployment.md.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test the live site
        env:
          # Bot Fight Mode is a setting on the vroelabs.com zone and it challenges
          # datacentre IPs, which is exactly what a GitHub runner is. workers.dev
          # is outside that zone, so the same deployment can be verified there
          # without being handed a "Just a moment..." interstitial. Same Worker,
          # same assets — and the HTML arrives byte-identical to the build, with
          # none of the script Bot Fight Mode injects on the custom domain.
          WORKER_URL: https://vroe-labs.devpatel1286.workers.dev
          SITE_URL: https://vroelabs.com
        run: |
          set -euo pipefail

          REQUIRED="content-security-policy strict-transport-security
                    x-content-type-options x-frame-options referrer-policy
                    cross-origin-opener-policy cross-origin-resource-policy
                    permissions-policy"

          PAGES="/ /trove /vero /notes/trove /notes/vero /about /contact
                 /privacy /terms /robots.txt /sitemap.xml /.well-known/security.txt"

          # Print what was actually received. A response can differ by client —
          # a bot challenge comes from Cloudflare rather than the Worker and
          # carries its own headers — so a bare "missing X" is not diagnosable.
          dump() {
            echo "--- response from this runner: $1 ---"
            curl -sS -o /dev/null -D /tmp/h.txt -w 'http_code=%{http_code}\n' "$1" || true
            cat /tmp/h.txt || true
            echo "--- end ---"
          }

          # True when Cloudflare answered instead of the Worker.
          challenged() {
            curl -sS -o /dev/null -D /tmp/c.txt "$1" || true
            grep -qi '^cf-mitigated:' /tmp/c.txt
          }

          check_headers() {
            local target="$1" headers missing
            headers=$(curl -sI "$target" || true)
            missing=""
            for h in $REQUIRED; do
              echo "$headers" | grep -qi "^$h:" || missing="$missing $h"
            done
            echo "$missing"
          }

          # ── 1. Verify the deployment itself, where nothing intercepts it ───
          echo "Verifying the deployed Worker at $WORKER_URL"

          # Poll: a Worker deploy propagates over rather longer than a fixed sleep.
          deadline=$((SECONDS + 180))
          while :; do
            missing=$(check_headers "$WORKER_URL/")
            [ -z "$missing" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::after 180s these headers are still missing:$missing"
              dump "$WORKER_URL/"; exit 1
            fi
            echo "  waiting for rollout — missing:$missing"
            sleep 5
          done
          echo "  all 8 security headers present"

          if curl -sI "$WORKER_URL/" | grep -qi "unsafe-inline"; then
            echo "::error::unsafe-inline in a response header"
            dump "$WORKER_URL/"; exit 1
          fi
          echo "  CSP carries no unsafe-inline"

          for path in $PAGES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; dump "$WORKER_URL$path"; exit 1; }
          done
          echo "  all 12 public routes return 200"

          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "$WORKER_URL/definitely-not-a-page")
          [ "$code" = "404" ] || { echo "::error::unknown path returned $code, expected 404"; exit 1; }
          echo "  unknown path returns 404"

          curl -s "$WORKER_URL/api/health" | grep -q '"ready":true' \
            || { echo "::error::/api/health not ready"; dump "$WORKER_URL/api/health"; exit 1; }
          echo "  /api/health reports ready"

          # ── 2. The custom domain ───────────────────────────────────────────
          #
          # Bot Fight Mode is deliberately on, so Cloudflare may answer this
          # runner before the Worker ever runs. That is the configured
          # behaviour, not a fault, so it is reported and accepted rather than
          # failing a deploy that is otherwise verified above. If the challenge
          # is ever not served — Bot Fight Mode turned off, or a skip rule added
          # — the full check below runs automatically and verification of the
          # production hostname comes back with no change to this file.
          echo "Checking $SITE_URL"
          if challenged "$SITE_URL/"; then
            echo "::notice::$SITE_URL served this runner a Cloudflare bot challenge (Bot Fight Mode is on), so the production hostname cannot be verified from CI. The deployment itself is verified above via $WORKER_URL."
          else
            missing=$(check_headers "$SITE_URL/")
            [ -z "$missing" ] || { echo "::error::missing on the production hostname:$missing"; dump "$SITE_URL/"; exit 1; }
            for path in $PAGES; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$path")
              [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
            done
            echo "  production hostname fully verified"
          fi

          echo "Live site verified."
