version: 2
updates:
  # Dependencies are reviewed, never auto-merged: a lockfile change is the main
  # way a compromised package reaches a build machine. Read the changelog and
  # the lockfile diff before approving.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
