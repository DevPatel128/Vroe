version: 2
updates:
  # Dependencies are reviewed, never auto-merged: a lockfile change is the main
  # way a compromised package reaches a build machine. Read the changelog and
  # the lockfile diff before approving.
  # The app moved into code/ on 4 September 2026. Pointed at "/", every weekly
  # run since then has failed with "/package.json not found".
  - package-ecosystem: npm
    directory: "/code"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencies"]

    # Packages that must move together, or the bump cannot resolve.
    #
    # react-dom declares an exact peer on react, so bumping one alone produces
    # an ERESOLVE that CI correctly rejects — three such PRs were opened and
    # failed before this grouping existed. Vite and its React plugin have the
    # same relationship across majors.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      fontsource:
        patterns: ["@fontsource/*"]

    ignore:
      # Wrangler tracks the Cloudflare platform and releases very frequently.
      # Patch and minor bumps are noise here; take majors deliberately.
      - dependency-name: wrangler
        update-types: ["version-update:semver-patch"]

  # Lighthouse lives in its own dependency tree (code/perf), so it needs its own
  # entry. Same policy: reviewed, never auto-merged.
  - package-ecosystem: npm
    directory: "/code/perf"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels: ["dependencies", "ci"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
